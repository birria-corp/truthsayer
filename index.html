<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0d0d">
<meta name="description" content="The Truthsayer — a weekly trivia segment on the Escape Hatch podcast">
<title>The Truthsayer</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface2: #1f1f1f;
    --border: #2a2a2a;
    --border2: #383838;
    --text: #e8e4dc;
    --muted: #7a7570;
    --dim: #4a4540;
    --gold: #c8a84b;
    --gold-dim: #7a6630;
    --gold-bg: #1a1508;
    --crimson: #8b1a1a;
    --crimson-dim: #5c1111;
    --navy: #1a2040;
    --danger: #c0392b;
    --success: #27ae60;
    --radius: 6px;
    --font-display: 'Georgia', 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'Courier New', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  #app-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 1.25rem;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.625rem;
  }

  .header-logo {
    width: 32px;
    height: 32px;
    object-fit: contain;
  }

  .header-title {
    font-family: var(--font-display);
    font-size: 1.1rem;
    color: var(--gold);
    letter-spacing: 0.04em;
  }

  .header-version {
    font-size: 0.7rem;
    color: var(--dim);
    font-family: var(--font-mono);
    margin-left: 0.25rem;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  /* ── NAV ── */
  #app-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    overflow-x: auto;
    scrollbar-width: none;
  }

  #app-nav::-webkit-scrollbar { display: none; }

  .nav-tab {
    padding: 0.75rem 1.25rem;
    font-size: 0.85rem;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: color 0.15s, border-color 0.15s;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    font-family: var(--font-body);
  }

  .nav-tab:hover { color: var(--text); }
  .nav-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

  /* ── MAIN ── */
  #app-main {
    max-width: 800px;
    margin: 0 auto;
    padding: 1.5rem 1.25rem;
  }

  /* ── VIEWS ── */
  .view { display: none; }
  .view.active { display: block; }

  /* ── AUTH BANNER ── */
  #auth-banner {
    background: var(--gold-bg);
    border: 1px solid var(--gold-dim);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }

  #auth-banner p {
    font-size: 0.85rem;
    color: var(--muted);
  }

  #auth-user {
    font-size: 0.8rem;
    color: var(--muted);
    font-style: italic;
  }

  /* ── BUTTONS ── */
  .btn {
    padding: 0.5rem 1rem;
    border-radius: var(--radius);
    border: 1px solid transparent;
    cursor: pointer;
    font-size: 0.85rem;
    font-family: var(--font-body);
    transition: opacity 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }

  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-primary {
    background: var(--gold);
    color: #0d0d0d;
    font-weight: 600;
  }

  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border-color: var(--border2);
  }

  .btn-danger {
    background: var(--danger);
    color: #fff;
  }

  .btn-ghost {
    background: none;
    color: var(--muted);
    border-color: var(--border);
  }

  .btn-sm {
    padding: 0.3rem 0.7rem;
    font-size: 0.78rem;
  }

  /* ── DASHBOARD ── */
  .dash-hero {
    text-align: center;
    padding: 2rem 0 1.5rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1.5rem;
  }

  .dash-logo {
    width: 100px;
    height: 100px;
    object-fit: contain;
    margin-bottom: 1rem;
  }

  .dash-tagline {
    font-family: var(--font-display);
    font-size: 0.95rem;
    color: var(--muted);
    font-style: italic;
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    margin-bottom: 1.5rem;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
    text-align: center;
  }

  .stat-num {
    font-family: var(--font-display);
    font-size: 2rem;
    color: var(--gold);
    line-height: 1;
    margin-bottom: 0.25rem;
  }

  .stat-label {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .recent-list { }

  .recent-header {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--dim);
    margin-bottom: 0.75rem;
  }

  .recent-item {
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    padding: 0.625rem 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
  }

  .recent-item:hover { background: var(--surface); margin: 0 -1.25rem; padding-left: 1.25rem; padding-right: 1.25rem; }
  .recent-item:last-child { border-bottom: none; }

  .recent-num {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--gold);
    min-width: 3.5rem;
  }

  .recent-film {
    font-size: 0.9rem;
    color: var(--text);
    flex: 1;
  }

  .recent-date {
    font-size: 0.75rem;
    color: var(--dim);
  }

  /* ── SEGMENT FORM ── */
  .form-section {
    margin-bottom: 1.5rem;
  }

  .form-section-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--dim);
    margin-bottom: 0.75rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
  }

  .form-row.single { grid-template-columns: 1fr; }
  .form-row.three { grid-template-columns: 1fr 1fr 1fr; }

  .field { display: flex; flex-direction: column; gap: 0.35rem; }

  label {
    font-size: 0.78rem;
    color: var(--muted);
    font-weight: 500;
  }

  input[type="text"],
  input[type="number"],
  input[type="date"],
  select,
  textarea {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 0.875rem;
    padding: 0.5rem 0.75rem;
    width: 100%;
    transition: border-color 0.15s;
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--gold-dim);
  }

  textarea { resize: vertical; min-height: 100px; line-height: 1.6; }

  textarea.tall { min-height: 180px; }

  select option { background: var(--surface2); }

  .field-hint {
    font-size: 0.72rem;
    color: var(--dim);
  }

  /* ── ENTRIES BUILDER ── */
  .entries-builder { }

  .entry-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.875rem;
    margin-bottom: 0.625rem;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    align-items: start;
  }

  .entry-num {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    color: var(--gold);
    padding-top: 0.4rem;
    min-width: 1.5rem;
  }

  .entry-fields { display: flex; flex-direction: column; gap: 0.5rem; }

  .entry-true-toggle {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    margin-top: 0.4rem;
    cursor: pointer;
  }

  .entry-true-toggle input { width: auto; }

  .entry-true-toggle span {
    font-size: 0.75rem;
    color: var(--muted);
  }

  .entry-row.is-true {
    border-color: var(--gold-dim);
    background: var(--gold-bg);
  }

  .entry-row.is-true .entry-num { color: var(--gold); }

  /* ── ARCHIVE ── */
  .archive-controls {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
  }

  .search-input {
    flex: 1;
    min-width: 200px;
  }

  .filter-select { min-width: 140px; }

  .segment-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
    margin-bottom: 0.75rem;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .segment-card:hover { border-color: var(--gold-dim); }

  .card-header {
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    margin-bottom: 0.4rem;
  }

  .card-num {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--gold);
    min-width: 4rem;
  }

  .card-film {
    font-size: 0.95rem;
    color: var(--text);
    font-weight: 500;
    flex: 1;
  }

  .card-date {
    font-size: 0.75rem;
    color: var(--dim);
  }

  .card-topic {
    font-size: 0.82rem;
    color: var(--muted);
    font-style: italic;
    padding-left: 4.75rem;
    margin-bottom: 0.25rem;
  }

  .card-truth {
    font-size: 0.82rem;
    color: var(--gold-dim);
    padding-left: 4.75rem;
  }

  .card-truth::before { content: "✓ "; color: var(--gold); }

  .card-status {
    display: inline-block;
    font-size: 0.65rem;
    padding: 0.15rem 0.4rem;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-left: 0.5rem;
  }

  .status-draft { background: var(--surface2); color: var(--muted); border: 1px solid var(--border2); }
  .status-published { background: #0d2010; color: var(--success); border: 1px solid #1a4025; }

  /* ── SEGMENT DETAIL MODAL ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 200;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem;
    overflow-y: auto;
  }

  .modal-overlay.hidden { display: none; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 8px;
    width: 100%;
    max-width: 640px;
    padding: 1.5rem;
    position: relative;
  }

  .modal-close {
    position: absolute;
    top: 1rem;
    right: 1rem;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1.2rem;
    line-height: 1;
    padding: 0.25rem;
  }

  .modal-close:hover { color: var(--text); }

  .modal-film {
    font-family: var(--font-display);
    font-size: 1.3rem;
    color: var(--gold);
    margin-bottom: 0.25rem;
  }

  .modal-meta {
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 1.25rem;
  }

  .modal-section-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--dim);
    margin-bottom: 0.5rem;
    margin-top: 1rem;
  }

  .modal-fulltext {
    font-size: 0.875rem;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
    font-family: var(--font-display);
  }

  .modal-entries { }

  .modal-entry {
    display: flex;
    gap: 0.75rem;
    padding: 0.5rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
  }

  .modal-entry:last-child { border-bottom: none; }
  .modal-entry-num { color: var(--gold); font-family: var(--font-mono); min-width: 1.5rem; }
  .modal-entry-text { color: var(--text); flex: 1; }
  .modal-entry.true-entry .modal-entry-text { color: var(--gold); }
  .modal-entry.true-entry::after { content: " ✓"; color: var(--gold); font-size: 0.75rem; }

  .modal-actions {
    display: flex;
    gap: 0.75rem;
    margin-top: 1.25rem;
    flex-wrap: wrap;
  }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(0);
    background: var(--surface2);
    border: 1px solid var(--border2);
    color: var(--text);
    padding: 0.625rem 1.25rem;
    border-radius: 20px;
    font-size: 0.85rem;
    z-index: 300;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }

  #toast.hidden { opacity: 0; transform: translateX(-50%) translateY(8px); }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--muted);
  }

  .empty-state-icon { font-size: 2.5rem; margin-bottom: 0.75rem; opacity: 0.4; }
  .empty-state p { font-size: 0.875rem; }

  /* ── LOADING ── */
  .loading-spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid var(--border2);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── FORM ACTIONS BAR ── */
  .form-actions {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .form-actions-spacer { flex: 1; }

  /* ── CHAR COUNT ── */
  .char-count {
    font-size: 0.72rem;
    color: var(--dim);
    text-align: right;
  }

  .char-count.warn { color: var(--gold); }
  .char-count.over { color: var(--danger); }

  /* ── RESPONSIVE ── */
  @media (max-width: 540px) {
    .form-row { grid-template-columns: 1fr; }
    .form-row.three { grid-template-columns: 1fr; }
    .stats-row { grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
    .stat-num { font-size: 1.5rem; }
    #app-main { padding: 1rem 0.875rem; }
    .card-topic, .card-truth { padding-left: 0; margin-top: 0.25rem; }
  }
</style>
</head>
<body>

<header id="app-header">
  <div class="header-brand">
    <img src="icon.png" alt="Truthsayer" class="header-logo">
    <span class="header-title">Truthsayer</span>
    <span class="header-version">v1.1</span>
  </div>
  <div class="header-right">
    <span id="auth-user"></span>
    <button class="btn btn-ghost btn-sm" id="auth-btn" onclick="handleAuthClick()">Sign in</button>
  </div>
</header>

<nav id="app-nav">
  <button class="nav-tab active" onclick="showView('dashboard')">Dashboard</button>
  <button class="nav-tab" onclick="showView('new-segment')" id="tab-new">New Segment</button>
  <button class="nav-tab" onclick="showView('archive')">Archive</button>
</nav>

<main id="app-main">

  <!-- ── DASHBOARD ── -->
  <div class="view active" id="view-dashboard">
    <div class="dash-hero">
      <img src="icon.png" alt="Truthsayer" class="dash-logo">
      <p class="dash-tagline">Two lies. One truth. Find it.</p>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num" id="stat-total">—</div>
        <div class="stat-label">Segments</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-published">—</div>
        <div class="stat-label">Published</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-latest">—</div>
        <div class="stat-label">Latest TS#</div>
      </div>
    </div>

    <p class="recent-header">Recent segments</p>
    <div id="recent-list">
      <div class="empty-state">
        <div class="loading-spinner"></div>
      </div>
    </div>
  </div>

  <!-- ── NEW SEGMENT ── -->
  <div class="view" id="view-new-segment">
    <div id="auth-banner">
      <p>Sign in with your Google account to publish segments.</p>
      <button class="btn btn-primary btn-sm" onclick="handleAuthClick()">Sign in with Google</button>
    </div>

    <div class="form-section">
      <p class="form-section-title">Film & Episode</p>
      <div class="form-row three">
        <div class="field">
          <label for="f-ts-num">TS Number</label>
          <input type="number" id="f-ts-num" placeholder="162">
        </div>
        <div class="field">
          <label for="f-ep-num">Episode #</label>
          <input type="number" id="f-ep-num" placeholder="320">
        </div>
        <div class="field">
          <label for="f-air-date">Air Date</label>
          <input type="date" id="f-air-date">
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label for="f-film">Film Title</label>
          <input type="text" id="f-film" placeholder="e.g. Chinatown (1974)">
        </div>
        <div class="field">
          <label for="f-variant">Segment Variant</label>
          <select id="f-variant">
            <option value="standard">Standard (2 false, 1 true)</option>
            <option value="list-false">List — find the false</option>
            <option value="list-true">List — find the true</option>
            <option value="all-true">All true</option>
            <option value="count">Count format</option>
            <option value="race">Trivia race</option>
          </select>
        </div>
      </div>
      <div class="form-row single">
        <div class="field">
          <label for="f-topic">Topic / Angle</label>
          <input type="text" id="f-topic" placeholder="e.g. Jack Nicholson's pre-fame years">
        </div>
      </div>
    </div>

    <div class="form-section">
      <p class="form-section-title">Entries</p>
      <div class="entries-builder" id="entries-builder">
        <!-- populated by JS -->
      </div>
      <button class="btn btn-ghost btn-sm" onclick="addEntry()" style="margin-top:0.5rem">+ Add entry</button>
    </div>

    <div class="form-section">
      <p class="form-section-title">Reveal & Closer</p>
      <div class="form-row single">
        <div class="field">
          <label for="f-true-story">True story summary</label>
          <input type="text" id="f-true-story" placeholder="One line — what the true answer actually is">
        </div>
      </div>
      <div class="form-row single">
        <div class="field">
          <label for="f-closer">Closing line / film quote</label>
          <input type="text" id="f-closer" placeholder="The last line before 'Here ends the Truthsayer'">
        </div>
      </div>
    </div>

    <div class="form-section">
      <p class="form-section-title">Full Segment Text</p>
      <div class="form-row single">
        <div class="field">
          <label for="f-fulltext">Paste the final segment text</label>
          <textarea class="tall" id="f-fulltext" placeholder="Paste the complete, final segment here after Grandmaster has approved it..."></textarea>
          <div class="char-count" id="char-count">0 words</div>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button class="btn btn-ghost" onclick="clearForm()">Clear</button>
      <div class="form-actions-spacer"></div>
      <button class="btn btn-secondary" onclick="saveSegment('draft')" id="btn-draft">Save draft</button>
      <button class="btn btn-primary" onclick="saveSegment('published')" id="btn-publish">Publish</button>
    </div>
  </div>

  <!-- ── ARCHIVE ── -->
  <div class="view" id="view-archive">
    <div class="archive-controls">
      <input type="text" class="search-input" placeholder="Search film, topic, true story..." id="archive-search" oninput="filterArchive()">
      <select class="filter-select" id="archive-filter" onchange="filterArchive()">
        <option value="all">All segments</option>
        <option value="published">Published</option>
        <option value="draft">Drafts</option>
      </select>
    </div>
    <div id="archive-list">
      <div class="empty-state">
        <div class="loading-spinner"></div>
      </div>
    </div>
  </div>

</main>

<!-- ── SEGMENT DETAIL MODAL ── -->
<div class="modal-overlay hidden" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModalDirect()">✕</button>
    <div class="modal-film" id="modal-film"></div>
    <div class="modal-meta" id="modal-meta"></div>

    <p class="modal-section-label">Entries</p>
    <div class="modal-entries" id="modal-entries"></div>

    <p class="modal-section-label">True story</p>
    <div style="font-size:0.85rem; color:var(--gold); margin-bottom:0.25rem" id="modal-truth"></div>

    <p class="modal-section-label">Full segment</p>
    <div class="modal-fulltext" id="modal-fulltext"></div>

    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<!-- ── TOAST ── -->
<div id="toast" class="hidden"></div>

<!-- ── FIREBASE ── -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, doc, addDoc, setDoc, getDocs, getDoc, deleteDoc, query, orderBy, limit, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyB2t-ZhuS7fx9PsxMBrlkHNJHS3ksjdYxI",
  authDomain: "truthsayer-4c3ee.firebaseapp.com",
  projectId: "truthsayer-4c3ee",
  storageBucket: "truthsayer-4c3ee.firebasestorage.app",
  messagingSenderId: "580802009161",
  appId: "1:580802009161:web:c94f81e3cbd6acefe54798"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentUser = null;
let allSegments = [];

// expose to window immediately so onclick handlers work
window._auth = auth;
window._db = db;
window._provider = provider;
window._signInWithPopup = signInWithPopup;
window._signInWithRedirect = signInWithRedirect;
window._signOut = signOut;
window._collection = collection;
window._doc = doc;
window._addDoc = addDoc;
window._setDoc = setDoc;
window._getDocs = getDocs;
window._getDoc = getDoc;
window._deleteDoc = deleteDoc;
window._query = query;
window._orderBy = orderBy;
window._limit = limit;
window._serverTimestamp = serverTimestamp;

// handle redirect result first
getRedirectResult(auth).catch(() => {});

onAuthStateChanged(auth, user => {
  currentUser = user;
  window._currentUser = user;
  updateAuthUI(user);
  loadSegments();
});

window._loadSegments = async function() {
  try {
    const q = query(collection(db, 'segments'), orderBy('createdAt', 'desc'));
    const snap = await getDocs(q);
    allSegments = [];
    snap.forEach(d => allSegments.push({ id: d.id, ...d.data() }));
    window._allSegments = allSegments;
    renderDashboard();
    renderArchive();
  } catch(e) {
    console.error('Load error', e);
  }
};
</script>

<script>
const APP_VERSION = '1.1';

// ── AUTH ──
function updateAuthUI(user) {
  const btn = document.getElementById('auth-btn');
  const userEl = document.getElementById('auth-user');
  const banner = document.getElementById('auth-banner');
  const tabNew = document.getElementById('tab-new');

  if (user) {
    btn.textContent = 'Sign out';
    userEl.textContent = user.email;
    if (banner) banner.style.display = 'none';
    tabNew.style.opacity = '1';
  } else {
    btn.textContent = 'Sign in';
    userEl.textContent = '';
    if (banner) banner.style.display = 'flex';
    tabNew.style.opacity = '0.5';
  }
}

function handleAuthClick() {
  if (window._currentUser) {
    window._signOut(window._auth).then(() => toast('Signed out'));
  } else {
    window._signInWithPopup(window._auth, window._provider)
      .then(() => toast('Signed in'))
      .catch(err => {
        if (err.code === 'auth/popup-blocked') {
          window._signInWithRedirect(window._auth, window._provider);
        } else {
          toast('Sign-in failed: ' + err.message);
        }
      });
  }
}

// ── NAVIGATION ──
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('view-' + id).classList.add('active');
  const tabs = document.querySelectorAll('.nav-tab');
  const labels = ['dashboard', 'new-segment', 'archive'];
  tabs[labels.indexOf(id)]?.classList.add('active');

  if (id === 'archive') renderArchive();
}

// ── ENTRIES BUILDER ──
let entries = [];

function initEntries() {
  entries = [
    { text: '', charText: '', isTrue: false },
    { text: '', charText: '', isTrue: false },
    { text: '', charText: '', isTrue: true }
  ];
  renderEntries();
}

function renderEntries() {
  const container = document.getElementById('entries-builder');
  container.innerHTML = '';
  entries.forEach((entry, i) => {
    const div = document.createElement('div');
    div.className = 'entry-row' + (entry.isTrue ? ' is-true' : '');
    div.innerHTML = `
      <span class="entry-num">#${i+1}</span>
      <div class="entry-fields">
        <textarea placeholder="Entry text..." rows="2" oninput="updateEntry(${i}, 'text', this.value)">${entry.text}</textarea>
        <label class="entry-true-toggle">
          <input type="radio" name="true-entry" ${entry.isTrue ? 'checked' : ''} onchange="setTrueEntry(${i})">
          <span>This is the true entry</span>
        </label>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="removeEntry(${i})" style="margin-top:0.25rem" ${entries.length <= 2 ? 'disabled' : ''}>✕</button>
    `;
    container.appendChild(div);
  });
}

function updateEntry(i, field, val) { entries[i][field] = val; }

function setTrueEntry(i) {
  entries.forEach((e, idx) => e.isTrue = (idx === i));
  renderEntries();
}

function addEntry() {
  entries.push({ text: '', isTrue: false });
  renderEntries();
}

function removeEntry(i) {
  if (entries.length <= 2) return;
  const wasTrue = entries[i].isTrue;
  entries.splice(i, 1);
  if (wasTrue && entries.length > 0) entries[0].isTrue = true;
  renderEntries();
}

// ── WORD COUNT ──
document.addEventListener('DOMContentLoaded', () => {
  initEntries();
  setDefaultDate();

  const ft = document.getElementById('f-fulltext');
  const cc = document.getElementById('char-count');
  if (ft && cc) {
    ft.addEventListener('input', () => {
      const words = ft.value.trim().split(/\s+/).filter(Boolean).length;
      cc.textContent = words + ' words';
      cc.className = 'char-count' + (words > 300 ? ' over' : words > 250 ? ' warn' : '');
    });
  }

  if (window._loadSegments) window._loadSegments();
});

function setDefaultDate() {
  const d = new Date();
  const iso = d.toISOString().split('T')[0];
  const el = document.getElementById('f-air-date');
  if (el) el.value = iso;
}

// ── SAVE SEGMENT ──
async function saveSegment(status) {
  if (!window._currentUser) { toast('Sign in to save segments'); return; }

  const film = document.getElementById('f-film').value.trim();
  const tsNum = document.getElementById('f-ts-num').value;
  const epNum = document.getElementById('f-ep-num').value;
  const airDate = document.getElementById('f-air-date').value;
  const topic = document.getElementById('f-topic').value.trim();
  const variant = document.getElementById('f-variant').value;
  const trueStory = document.getElementById('f-true-story').value.trim();
  const closer = document.getElementById('f-closer').value.trim();
  const fullText = document.getElementById('f-fulltext').value.trim();

  if (!film) { toast('Film title is required'); return; }
  if (entries.filter(e => e.isTrue).length !== 1) { toast('Exactly one entry must be marked true'); return; }

  const btn = document.getElementById('btn-' + (status === 'draft' ? 'draft' : 'publish'));
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-spinner"></span>';

  try {
    const data = {
      tsNumber: tsNum ? parseInt(tsNum) : null,
      episodeNumber: epNum ? parseInt(epNum) : null,
      airDate: airDate || null,
      film,
      topic,
      variant,
      entries: entries.map(e => ({ text: e.text, isTrue: e.isTrue })),
      trueStory,
      closer,
      fullText,
      status,
      authorUid: window._currentUser.uid,
      authorEmail: window._currentUser.email,
      createdAt: window._serverTimestamp(),
      updatedAt: window._serverTimestamp()
    };

    await window._addDoc(window._collection(window._db, 'segments'), data);
    toast(status === 'published' ? 'Segment published ✓' : 'Draft saved ✓');
    clearForm();
    await window._loadSegments();
    if (status === 'published') showView('archive');
  } catch(e) {
    toast('Error: ' + e.message);
    console.error(e);
  } finally {
    btn.disabled = false;
    btn.textContent = status === 'draft' ? 'Save draft' : 'Publish';
  }
}

function clearForm() {
  ['f-film','f-topic','f-ts-num','f-ep-num','f-true-story','f-closer','f-fulltext'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.getElementById('f-variant').value = 'standard';
  document.getElementById('char-count').textContent = '0 words';
  setDefaultDate();
  initEntries();
}

// ── DASHBOARD ──
function renderDashboard() {
  const segments = window._allSegments || [];
  const published = segments.filter(s => s.status === 'published');
  const tsNums = segments.map(s => s.tsNumber).filter(Boolean);
  const latest = tsNums.length ? Math.max(...tsNums) : '—';

  document.getElementById('stat-total').textContent = segments.length;
  document.getElementById('stat-published').textContent = published.length;
  document.getElementById('stat-latest').textContent = latest !== '—' ? 'TS-' + latest : '—';

  const list = document.getElementById('recent-list');
  const recent = segments.slice(0, 10);

  if (!recent.length) {
    list.innerHTML = '<div class="empty-state"><p>No segments yet. Add your first one.</p></div>';
    return;
  }

  list.innerHTML = recent.map(s => `
    <div class="recent-item" onclick="openModal('${s.id}')">
      <span class="recent-num">${s.tsNumber ? 'TS-' + s.tsNumber : '—'}</span>
      <span class="recent-film">${esc(s.film)}</span>
      <span class="recent-date">${formatDate(s.airDate)}</span>
    </div>
  `).join('');
}

// ── ARCHIVE ──
function renderArchive() {
  const segments = window._allSegments || [];
  filterArchive(segments);
}

function filterArchive() {
  const q = document.getElementById('archive-search')?.value.toLowerCase() || '';
  const f = document.getElementById('archive-filter')?.value || 'all';
  const segments = window._allSegments || [];

  let filtered = segments.filter(s => {
    if (f !== 'all' && s.status !== f) return false;
    if (!q) return true;
    return (s.film || '').toLowerCase().includes(q)
      || (s.topic || '').toLowerCase().includes(q)
      || (s.trueStory || '').toLowerCase().includes(q)
      || (s.fullText || '').toLowerCase().includes(q);
  });

  const list = document.getElementById('archive-list');
  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state"><p>No segments found.</p></div>';
    return;
  }

  list.innerHTML = filtered.map(s => `
    <div class="segment-card" onclick="openModal('${s.id}')">
      <div class="card-header">
        <span class="card-num">${s.tsNumber ? 'TS-' + s.tsNumber : 'TS-?'}</span>
        <span class="card-film">${esc(s.film)}<span class="card-status status-${s.status}">${s.status}</span></span>
        <span class="card-date">${formatDate(s.airDate)}</span>
      </div>
      ${s.topic ? `<div class="card-topic">${esc(s.topic)}</div>` : ''}
      ${s.trueStory ? `<div class="card-truth">${esc(s.trueStory)}</div>` : ''}
    </div>
  `).join('');
}

// ── MODAL ──
function openModal(id) {
  const s = (window._allSegments || []).find(x => x.id === id);
  if (!s) return;

  document.getElementById('modal-film').textContent = s.film || '';
  document.getElementById('modal-meta').innerHTML =
    `${s.tsNumber ? 'TS-' + s.tsNumber : ''} ${s.episodeNumber ? '· Ep ' + s.episodeNumber : ''} · ${formatDate(s.airDate)} · ${s.variant || 'standard'} · <span class="card-status status-${s.status}">${s.status}</span>`;

  const entriesEl = document.getElementById('modal-entries');
  if (s.entries && s.entries.length) {
    entriesEl.innerHTML = s.entries.map((e, i) => `
      <div class="modal-entry ${e.isTrue ? 'true-entry' : ''}">
        <span class="modal-entry-num">#${i+1}</span>
        <span class="modal-entry-text">${esc(e.text)}</span>
      </div>
    `).join('');
  } else {
    entriesEl.innerHTML = '<p style="color:var(--muted);font-size:0.82rem">No entries recorded.</p>';
  }

  document.getElementById('modal-truth').textContent = s.trueStory || '';
  document.getElementById('modal-fulltext').textContent = s.fullText || 'No full text saved.';

  const actions = document.getElementById('modal-actions');
  actions.innerHTML = '';
  if (window._currentUser) {
    const delBtn = document.createElement('button');
    delBtn.className = 'btn btn-danger btn-sm';
    delBtn.textContent = 'Delete';
    delBtn.onclick = () => deleteSegment(id);
    actions.appendChild(delBtn);

    const copyBtn = document.createElement('button');
    copyBtn.className = 'btn btn-secondary btn-sm';
    copyBtn.textContent = 'Copy text';
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(s.fullText || '').then(() => toast('Copied ✓'));
    };
    actions.appendChild(copyBtn);
  }

  document.getElementById('modal-overlay').classList.remove('hidden');
}

function closeModal(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModalDirect();
}

function closeModalDirect() {
  document.getElementById('modal-overlay').classList.add('hidden');
}

async function deleteSegment(id) {
  if (!confirm('Delete this segment? This cannot be undone.')) return;
  try {
    await window._deleteDoc(window._doc(window._db, 'segments', id));
    closeModalDirect();
    await window._loadSegments();
    toast('Segment deleted');
  } catch(e) {
    toast('Delete failed: ' + e.message);
  }
}

// ── LOAD ──
function loadSegments() {
  if (window._loadSegments) window._loadSegments();
}

// ── UTILS ──
function toast(msg, duration = 2800) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.add('hidden'), duration);
}

function formatDate(d) {
  if (!d) return '';
  try {
    return new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  } catch { return d; }
}

function esc(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>

</body>
</html>
